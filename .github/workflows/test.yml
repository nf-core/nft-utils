name: Run plugin tests
on:
  push:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

env:
  NFT_WORKDIR: "~"
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
jobs:
  # Docs-only changes skip the plugin tests
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Detect plugin changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            plugin:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!mkdocs.yml"

  test:
    needs: [changes]
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.04.9"
          - "latest-everything"

    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.19

      # The Nextflow launcher from mise downloads the version set in NXF_VER
      - name: Select Nextflow ${{ matrix.NXF_VER }}
        env:
          VERSION: ${{ matrix.NXF_VER }}
        run: |
          if [[ $VERSION == latest-everything ]]; then
            VERSION=$(for channel in latest edge; do
              curl -fsSL "https://www.nextflow.io/releases/$channel/version"; echo
            done | sort -V | tail -1)
          fi
          echo "NXF_VER=$VERSION" >> "$GITHUB_ENV"

      - name: Test plugin
        run: |
          mise run validate
          mise run validate-noplugins

  # The only required check here, so matrix changes need no ruleset change
  ci-pass:
    name: CI pass
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
