name: Run plugin tests
on:
  push:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

env:
  NFT_WORKDIR: "~"
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
  # Both come from setup-nextflow, so CI has one JDK and the matrix decides the Nextflow version
  MISE_DISABLE_TOOLS: java,github:nextflow-io/nextflow
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.04.9"
          - "latest-everything"

    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}

      - name: Setup Nextflow ${{ matrix.NXF_VER }}
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}
          java-version: 21

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.19

      - name: Unit tests
        run: mise run test

      - name: Test plugin
        # filterNextflowOutput snapshots do not match latest-everything yet
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        run: |
          mise run validate
          mise run validate-noplugins

  # The only required check here, so matrix changes need no ruleset change
  ci-pass:
    name: CI pass
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
