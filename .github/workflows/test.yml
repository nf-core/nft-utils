name: Run plugin tests
on:
  push:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

env:
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
  NXF_SYNTAX_PARSER: "v2"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Nextflow comes from conda: nf-core depends on it, so a separately
        # installed Nextflow is shadowed once the micromamba env is active.
        NXF_VER:
          - "26.04.7"
          - "latest"

    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Setup Micromamba (Nextflow ${{ matrix.NXF_VER }})
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: environment.yml
          create-args: >-
            conda-forge::openjdk=17
            bioconda::nextflow${{ matrix.NXF_VER != 'latest' && format('={0}', matrix.NXF_VER) || '' }}
          # a cached env would freeze "latest"
          cache-environment: ${{ matrix.NXF_VER != 'latest' }}

      - name: Check tools
        shell: bash -el {0}
        run: |
          java -version
          nextflow -version
          nf-test version

      - name: Build plugin
        shell: bash -el {0}
        run: ./build.sh

      - name: Test plugin
        shell: bash -el {0}
        run: ./test.sh
