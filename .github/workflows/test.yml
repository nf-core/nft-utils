name: Run plugin tests
on:
  push:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

env:
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
  NXF_SYNTAX_PARSER: "v2"
  # Nextflow comes from setup-nextflow, so the matrix decides the version, not mise.toml
  MISE_DISABLE_TOOLS: github:nextflow-io/nextflow
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.01.1-edge"
          - "latest-everything"

    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.19

      - name: Setup Nextflow ${{ matrix.NXF_VER }}
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}

      - name: Unit tests
        run: mise run test

      - name: Test plugin
        # filterNextflowOutput snapshots do not match latest-everything yet
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        run: |
          mise run validate
          mise run validate-noplugins
