[tools]
java = "temurin-21"
uv = "0.13.7"
"github:nextflow-io/nextflow" = { version = "26.04.9", asset_pattern = "nextflow", bin = "nextflow" }
"github:askimed/nf-test" = "0.9.5"
"pipx:nf-core" = "4.1.0"

# Settings that change nf-test snapshots, so local runs match CI
[env]
# Unset, as these turn on Nextflow's agent mode, and NXF_AGENT_MODE cannot override them before 26.10
AGENT = false
CLAUDECODE = false
NXF_ANSI_LOG = "false"
NXF_SYNTAX_PARSER = "v2"

[tasks.clean]
description = "Remove build and nf-test artifacts"
run = """
./mvnw -B clean
rm -rf .nf-test .nextflow*
"""

[tasks.assemble]
description = "Lint and package the plugin"
sources = ["pom.xml", "src/**"]
outputs = ["target/nft-utils-*.jar"]
run = "./mvnw -B clean verify -DskipTests"

[tasks.test]
description = "Run the unit tests"
run = "./mvnw -B test"

[tasks.validate]
description = "Run the nf-tests in tests/, or on the given paths and options"
depends = ["assemble"]
run = '''
#!/usr/bin/env bash
nf-test test --plugins target/nft-utils-*.jar --verbose --debug "${@:-tests/}"
'''

[tasks.validate-noplugins]
description = "Run the nf-tests that need nft-bam and nft-vcf to be absent"
depends = ["assemble"]
run = "nf-test test --plugins target/nft-utils-*.jar --verbose --debug --config tests_noplugins/nf-test_noplugins.config tests_noplugins/sanitizeOutput/"
