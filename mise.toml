[tasks.build]
description = "Build, lint and package the plugin"
run = "mvn -B clean verify"

[tasks.test]
description = "Run the nf-tests on the whole suite, or on the given paths and options"
run = '''
#!/usr/bin/env bash
set -euo pipefail

PLUGIN_JAR=$(find target -maxdepth 1 -name 'nft-utils-*.jar' -type f -print -quit)

[[ -n "$PLUGIN_JAR" ]] || {
    echo "ERROR: Plugin JAR not found in target/" >&2
    exit 1
}

if [[ $# -eq 0 ]]; then
    nf-test test \
        --plugins "$PLUGIN_JAR" \
        --verbose \
        --debug \
        tests/

    nf-test test \
        --plugins "$PLUGIN_JAR" \
        --config tests_noplugins/nf-test_noplugins.config \
        tests_noplugins/sanitizeOutput/
else
    nf-test test \
        --plugins "$PLUGIN_JAR" \
        --verbose \
        --debug \
        "$@"
fi
'''

[tasks.bump]
description = "Set the plugin version everywhere, then build"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -ne 1 ]]; then
    echo "Usage: mise run bump <version>" >&2
    exit 1
fi

version="$1"
if [[ -z "$version" ]]; then
    echo "ERROR: Version cannot be empty" >&2
    exit 1
fi

if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
    echo "ERROR: Invalid version: $version" >&2
    exit 1
fi

echo "Bumping version to $version"

sed -i -e "0,/<version>/{s/<version>.*<\\/version>/<version>$version<\\/version>/}" \
  ./pom.xml

sed -i -e "s/moduleVersion=.*/moduleVersion=$version/" \
  ./src/main/resources/META-INF/nf-test-plugin

if [[ "$version" != *dev ]]; then
  sed -i -e "s/load \"nft-utils@.*\"/load \"nft-utils@$version\"/" \
    ./docs/index.md
fi

mise run build
'''
